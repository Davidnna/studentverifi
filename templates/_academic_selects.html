<label for="faculty">Faculty *
  <select name="faculty" id="faculty" required>
    <option value="">Select faculty</option>
    {% for faculty in catalogue %}<option value="{{ faculty }}" {% if request.form.get('faculty') == faculty %}selected{% endif %}>{{ faculty }}</option>{% endfor %}
  </select>
</label>
<label for="department">Department *
  <select name="department" id="department" required data-current="{{ request.form.get('department', '') }}"><option value="">Select faculty first</option></select>
</label>
<script>
(function () {
  const catalogue = {{ catalogue|tojson }};
  const faculty = document.getElementById('faculty');
  const department = document.getElementById('department');
  const selected = department.dataset.current || '';
  function populate() {
    const value = faculty.value;
    const choices = catalogue[value] || [];
    department.replaceChildren(new Option(value ? 'Select department' : 'Select faculty first', ''));
    choices.forEach(item => department.add(new Option(item, item, false, item === selected)));
  }
  faculty.addEventListener('change', populate);
  populate();
})();
</script>
