{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="panel auth-panel"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change password</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
<label>New password<input type="password" name="new_password" required minlength="10" autocomplete="new-password"><small>Use at least 10 characters.</small></label>
<button class="btn primary full" type="submit">Update password</button></form></section></div>
{% endblock %}
