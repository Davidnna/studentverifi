name: Compile and verify StudentVerifi

on:
    push:
        branches:
            - main
            - master
            - "studentverifi-v3*"

# Write access is used only for the follow-up commit containing compiled React assets.
permissions:
    contents: write

jobs:
    build-and-test:
        if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'build: publish React assets for Vercel') }}"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: true
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install dependencies
              run: |
                  npm install --include=dev --no-audit --no-fund
                  python -m pip install -r requirements.txt
            - name: Compile React into public/
              run: |
                  npm run check
                  npm run build
                  printf '\n<!-- STUDENTVERIFI_SOURCE_COMMIT:%s -->\n' "$GITHUB_SHA" >> public/index.html
                  python build.py
            - name: Run tests
              env:
                  SECRET_KEY: test-only-secret-of-at-least-thirty-two-characters
              run: python -m unittest discover -s tests -v
            - name: Commit generated assets for Vercel
              if: github.event_name == 'push'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -f public/index.html public/assets public/favicon.svg public/logo.svg public/email-logo.png
                  if git diff --cached --quiet; then
                      echo "Compiled assets already match source."
                      exit 0
                  fi
                  git commit -m "build: publish React assets for Vercel [skip ci]"
                  git push origin "HEAD:${GITHUB_REF_NAME}"
