name: StudentVerifi merged release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py spa_api.py academic_catalogue.py
      - run: pytest -q tests
        env:
          SECRET_KEY: test-ci-secret-with-over-32-characters
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: test -s public/index.html && test -n "$(find public/assets -name '*.js' -print -quit)"
